version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: secondhand-mysql
    environment:
      MYSQL_ROOT_PASSWORD: 123456
      MYSQL_DATABASE: ershouwupinjiaoyipingtai
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    restart: always
    command: --default-authentication-plugin=mysql_native_password

  redis:
    image: redis:7.0
    container_name: secondhand-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: always

  app:
    build: .
    container_name: secondhand-app
    ports:
      - "8080:8080"
    depends_on:
      - redis
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://localhost:3306/ershouwupinjiaoyipingtai?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=GMT%2B8
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: 123456
      SPRING_REDIS_HOST: redis
      SPRING_REDIS_PORT: 6379
    restart: always

volumes:
  mysql-data:
  redis-data: